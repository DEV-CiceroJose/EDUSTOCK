{% extends 'base.html' %}

{% block content %}
<div class="bg-white p-6 rounded-xl shadow">
    <div class="flex justify-between mb-4">
        <h2 class="text-xl font-bold">Categorias</h2>
        <a href="{% url 'criar_categoria' %}" class="bg-blue-500 text-white px-4 py-2 rounded">+ Nova</a>
    </div>

    <ul class="space-y-2">
        {% for categoria in categorias %}
            <li class="bg-gray-100 p-3 rounded">{{ categoria.nome }}</li>
        {% empty %}
            <li>Nenhuma categoria cadastrada</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
