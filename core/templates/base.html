<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>EASYSTOCK</title>
    <style>
        input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background-color: #ffffff !important;
        color: #000000 !important;
    }

        input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 1px #3b82f6;
    }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow">
    <div class="flex items-center gap-4">
        <!-- LOGO ESCOLA -->
        <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center font-bold text-slate-900">
            LOGO
        </div>

        <!-- LOGO SISTEMA -->
        <div class="flex items-center gap-2">
            <div class="bg-blue-500 p-2 rounded-lg">📦</div>
            <span class="text-xl font-bold">EASYSTOCK</span>
        </div>
    </div>

    <nav class="flex gap-6 text-sm">
        <a href="{% url 'lista_produtos' %}" class="hover:text-blue-400">Produtos</a>
        <a href="{% url 'lista_categorias' %}" class="hover:text-blue-400">Categorias</a>
    </nav>
</header>

<main class="p-6 max-w-5xl mx-auto">
    {% block content %}{% endblock %}
</main>

</body>
</html>
