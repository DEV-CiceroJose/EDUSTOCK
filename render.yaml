services:
  # Backend Django API
  - type: web
    name: edustock-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn easystock.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: edustock-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: easystock.settings
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DEBUG
        value: false

  # Frontend Principal (Dashboard Admin)
  - type: web
    name: edustock-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # App Cozinha
  - type: web
    name: edustock-cozinha
    runtime: static
    buildCommand: "cd app-cozinha && npm install && npm run build"
    staticPublishPath: app-cozinha/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # App Alunos
  - type: web
    name: edustock-alunos
    runtime: static
    buildCommand: "cd app-alunos && npm install && npm run build"
    staticPublishPath: app-alunos/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: edustock-db
    databaseName: edustock
    user: edustock
