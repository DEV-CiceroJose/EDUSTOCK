services:
  - type: web
    name: edustock-dashboard
    runtime: static
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: node deploy/validate-render-env.mjs dashboard && cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: VITE_API_URL
        sync: false
      - key: VITE_DEMO_MODE
        value: "false"
    buildFilter:
      paths:
        - frontend/**
        - deploy/validate-render-env.mjs
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https:; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

