name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Pacote VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_TAG: ci
      POSTGRES_PASSWORD: somente_validacao_ci
      SECRET_KEY: somente-validacao-ci-sem-uso-em-producao
      PIN_LOOKUP_SECRET: somente-validacao-pin-ci-sem-uso-em-producao
      API_HOST: api.example.com
      PAINEL_HOST: painel.example.com
      ALUNOS_HOST: alunos.example.com
      COZINHA_HOST: cozinha.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validar composição dos serviços
        run: docker compose -f deploy/compose.yml config --quiet
      - name: Gerar imagem da API
        run: docker build -f deploy/Dockerfile.api -t edustock-api:ci .
      - name: Gerar imagem dos aplicativos
        run: docker build -f deploy/Dockerfile.web --build-arg API_ORIGIN=https://api.example.com -t edustock-web:ci .
      - name: Validar proxy HTTPS
        run: docker run --rm -e API_HOST -e PAINEL_HOST -e ALUNOS_HOST -e COZINHA_HOST edustock-web:ci caddy validate --config /etc/caddy/Caddyfile
      - name: Iniciar API e PostgreSQL com configuração de produção
        run: |
          docker compose -f deploy/compose.yml up -d --no-build db api
          for attempt in $(seq 1 30); do
            if docker compose -f deploy/compose.yml exec -T api python -c 'import os, urllib.request; request=urllib.request.Request("http://127.0.0.1:8000/api/health/", headers={"Host":os.environ["ALLOWED_HOSTS"], "X-Forwarded-Proto":"https"}); assert urllib.request.urlopen(request, timeout=5).status == 200'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Validar backup e restauração em banco separado
        run: |
          docker compose -f deploy/compose.yml exec -T db pg_dump -U edustock -Fc edustock > "$RUNNER_TEMP/edustock-ci.dump"
          docker compose -f deploy/compose.yml exec -T db createdb -U edustock edustock_restore_check
          docker compose -f deploy/compose.yml exec -T db pg_restore -U edustock --exit-on-error -d edustock_restore_check < "$RUNNER_TEMP/edustock-ci.dump"
          docker compose -f deploy/compose.yml exec -T db psql -U edustock -d edustock_restore_check -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) FROM distribuicao_aluno;'
      - name: Logs da inicialização em caso de falha
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail=100 api db
      - name: Encerrar ambiente descartável da CI
        if: always()
        run: docker compose -f deploy/compose.yml down

  backend:
    name: Backend Django
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar migrações
        run: python manage.py makemigrations --check --dry-run
      - name: Rodar testes
        run: python manage.py test

  security:
    name: Segurança de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Auditar dependências Python
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app-alunos/package-lock.json
            app-cozinha/package-lock.json
      - name: Auditar dependências do Dashboard
        run: npm ci --prefix frontend && npm audit --omit=dev --prefix frontend
      - name: Auditar dependências do Alunos
        run: npm ci --prefix app-alunos && npm audit --omit=dev --prefix app-alunos
      - name: Auditar dependências da Cozinha
        run: npm ci --prefix app-cozinha && npm audit --omit=dev --prefix app-cozinha

  postgres:
    name: Backend PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edustock_ci
          POSTGRES_USER: edustock
          POSTGRES_PASSWORD: edustock_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edustock -d edustock_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://edustock:edustock_ci_password@localhost:5432/edustock_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Aplicar migrações no PostgreSQL vazio
        run: python manage.py migrate --noinput
      - name: Validar migrações
        run: python manage.py makemigrations --check --dry-run
      - name: Rodar suíte completa no PostgreSQL
        run: python manage.py test --noinput

  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - app-alunos
          - app-cozinha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Instalar dependências
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Validar lint
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm run lint
      - name: Validar TypeScript
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm run typecheck
      - name: Rodar testes
        working-directory: ${{ matrix.app }}
        run: npm test -- --run
      - name: Gerar build
        working-directory: ${{ matrix.app }}
        run: npm run build

  e2e:
    name: Fluxos críticos E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app-alunos/package-lock.json
            app-cozinha/package-lock.json
      - name: Instalar dependências
        run: |
          npm ci --prefix frontend --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2
          npm ci --prefix app-alunos --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2
          npm ci --prefix app-cozinha --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2
      - name: Instalar navegador de testes
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validar fluxos críticos
        working-directory: frontend
        run: npm run test:e2e
      - name: Guardar evidências dos testes de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-navegador
          path: frontend/test-results/
          retention-days: 7
