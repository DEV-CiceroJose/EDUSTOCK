name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Django
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar migrações
        run: python manage.py makemigrations --check --dry-run
      - name: Rodar testes
        run: python manage.py test

  postgres:
    name: Backend PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edustock_ci
          POSTGRES_USER: edustock_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edustock_ci -d edustock_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://edustock_ci:ci-only-password@127.0.0.1:5432/edustock_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Aplicar migrações no PostgreSQL vazio
        run: python manage.py migrate --noinput
      - name: Rodar testes no PostgreSQL
        run: python manage.py test --noinput

  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - app-alunos
          - app-cozinha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Instalar dependências
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Validar lint
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm run lint
      - name: Validar TypeScript
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm run typecheck
      - name: Rodar testes
        working-directory: ${{ matrix.app }}
        run: npm test -- --run
      - name: Gerar build
        working-directory: ${{ matrix.app }}
        run: npm run build

  e2e:
    name: Fluxos críticos E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            app-alunos/package-lock.json
            app-cozinha/package-lock.json
      - name: Instalar dependências
        run: |
          npm ci --prefix frontend
          npm ci --prefix app-alunos
          npm ci --prefix app-cozinha
      - name: Instalar navegador de testes
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validar fluxos críticos
        working-directory: frontend
        run: npm run test:e2e
